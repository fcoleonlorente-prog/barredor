name: Publicar instalador firmado

# Se lanza al subir una etiqueta (git tag v1.0.1 && git push origin v1.0.1) o a mano desde la pestaña Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # En CI electron-builder puede incrustar el icono él mismo (en el PC local se usa build/afterPack.js).
      - run: npx electron-builder --win nsis --publish never -c.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Subir instalador sin firmar
        id: sin-firmar
        uses: actions/upload-artifact@v4
        with:
          name: instalador-sin-firmar
          path: dist/*Setup*.exe
      # Requiere la cuenta de SignPath Foundation: ver SIGNING.md.
      - name: Firmar con SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: barredor
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmado
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" firmado/*.exe --title "Barredor ${{ github.ref_name }}" --generate-notes
